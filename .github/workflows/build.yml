name: CSH CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libzmq3-dev libsocketcan-dev libpython3-dev can-utils fonts-powerline build-essential pkg-config python3-dev python3-pip python3-venv libbsd-dev
      - name: Install gcovr
        run: pip3 install gcovr==8.3 meson==1.8.1
      - name: Build
        run: ./configure -Db_coverage=true && ninja -C builddir -v
      - name: Run gcovr
        run: ninja -C builddir test coverage-text && tail -n3 builddir/meson-logs/coverage.txt
